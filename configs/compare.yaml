# 多 target 对比示例：本地 vLLM + 官方 API。
# 运行前设置 DEEPSEEK_API_KEY。

run:
  name: vllm-vs-deepseek
  seed: 42
  output_dir: results
  cooldown_s: 5
  save_generated_text: false
  save_itl: false

workload:
  dataset: random
  requests_per_cell: 40
  warmup_requests: 2
  # 每个 cell：输入内容 token 数-输出 token 上限-并发
  cells:
    - 512-128-1
    - 512-128-4
    - 512-128-8
  system_prompt: ""
  tokenizer: null
  stream_options: auto

targets:
  - name: vllm-qwen
    backend: openai-chat
    base_url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3-8B
    tokenizer: null
    api_key_env: null
    # api_key: sk-your-key
    headers: {}
    timeout_s: 300
    max_tokens_field: max_tokens
    request_params:
      temperature: 0
      ignore_eos: true
    http2: false
    verify_tls: true
    ca_bundle: null

  - name: deepseek
    backend: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    tokenizer: null
    api_key_env: DEEPSEEK_API_KEY
    # api_key: sk-your-key
    headers: {}
    timeout_s: 300
    max_tokens_field: max_tokens
    request_params:
      temperature: 0
    http2: false
    verify_tls: true
    ca_bundle: null
