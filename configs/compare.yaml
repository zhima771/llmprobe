run:
  name: vllm-vs-deepseek
  seed: 42
  output_dir: results
  repeats: 2
  cooldown_s: 5

workload:
  dataset: random
  requests_per_cell: 40
  warmup_requests: 2
  concurrencies: [1, 4, 8]
  input_lengths: [512]
  output_lengths: [128]
  stream_options: auto

targets:
  - name: vllm-qwen
    backend: openai-chat
    base_url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3-8B
    request_params:
      temperature: 0
      ignore_eos: true

  - name: deepseek
    backend: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 300
    request_params:
      temperature: 0
