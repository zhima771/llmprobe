# 单个本地 vLLM/OpenAI-compatible chat 服务示例。
# 所有工具支持的配置字段都在这里展示；按需修改 base_url/model/tokenizer。

run:
  name: vllm-local
  seed: 42
  output_dir: results
  cooldown_s: 2
  save_generated_text: false
  save_itl: false

workload:
  dataset: random
  requests_per_cell: 60
  warmup_requests: 3
  concurrency: [1, 2, 4, 8]
  input_lengths: [128, 1024]
  output_lengths: [128]
  system_prompt: ""
  # 可选：内置别名、tokenizer.json 路径、模型目录或 HF repo id
  tokenizer: null
  # auto: probe 探测 usage；include_usage: 强制请求 usage；none: 关闭
  stream_options: auto

targets:
  - name: vllm-qwen
    backend: openai-chat
    base_url: http://127.0.0.1:8000/v1
    model: Qwen/Qwen3-8B
    # 可选：target 级 tokenizer，覆盖 workload.tokenizer
    tokenizer: null

    # API Key 二选一。推荐环境变量；直接写 api_key 仅用于不方便设置环境变量的场景。
    api_key_env: null
    # api_key: sk-your-key

    headers: {}
    timeout_s: 300
    max_tokens_field: max_tokens
    request_params:
      temperature: 0
      ignore_eos: true
    http2: false
    verify_tls: true
    ca_bundle: null
