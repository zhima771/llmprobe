[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmprobe"
version = "0.1.0"
description = "Lightweight probe for OpenAI-compatible LLM serving performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "h2>=4",
  "httpx>=0.27,<1",
  "PyYAML>=6",
  "rich>=13",
  "socksio>=1.0",
]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.20", "huggingface-hub>=0.23"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
llmprobe = "llmprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
llmprobe = ["tokenizers/*/tokenizer.json", "tokenizers/manifest.json", "tokenizers/README.md", "tokenizers/THIRD_PARTY_NOTICES.md", "tokenizers/licenses/*"]
